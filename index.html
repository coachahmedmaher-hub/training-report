<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ahmed Maher Client Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<section class="band">
  <div class="plate" aria-hidden="true"></div>
  <div class="langbar">
    <div class="langwrap">
      <button type="button" class="globe" id="globe" aria-haspopup="true" aria-expanded="false" aria-controls="langmenu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3Z"/></svg>
        <span id="langname">English</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="langmenu" id="langmenu" role="menu" hidden></div>
    </div>
  </div>
  <div class="band-in">
    <div class="mark">
      <span class="role" data-i="role">Coach</span>
      <h1 class="word" dir="ltr"><span class="solid" id="first">AHMED</span><span class="outline" id="last">MAHER</span></h1>
      <p class="tagline" data-i="tagline"></p>
      <div class="contact" id="contact"></div>
    </div>
    <form class="finder" id="finder" autocomplete="off">
      <h2 data-i="findTitle">Your training report</h2>
      <p data-i="findSub">Type the personal code your coach gave you.</p>
      <label for="code" style="position:absolute;left:-9999px" data-i="codeLabel">Client code</label>
      <div class="search" dir="ltr">
        <svg class="sicon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7b8592" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="code" name="code" placeholder="e.g. HANI-7K4Q2M" maxlength="40" spellcheck="false" autocapitalize="characters">
        <button type="submit" id="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-i="go">Get my report</span></button>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div class="legal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span id="legal"></span>
      </div>
    </form>
  </div>
</section>

<main id="report" hidden></main>

<section class="adwrap">
  <a class="ad" id="ad" target="_blank" rel="noopener">
    <span class="ad-bg" aria-hidden="true">RECOVERY</span>
    <span class="ad-icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.6 0 5.8 3.5 4.5 7.1C19.5 16.4 12 21 12 21Z"/><path d="M3.5 12h4l2-3 3 6 2-3h6"/></svg>
    </span>
    <span class="ad-text">
      <span class="ad-eyebrow" data-i="adEyebrow">Recovery</span>
      <span class="ad-title" data-i="adTitle">Book your recovery session</span>
      <span class="ad-sub" data-i="adText"></span>
    </span>
    <span class="ad-btn"><span data-i="adBtn">Book now</span>
      <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>
</section>

<footer class="sitefoot"><span id="copy"></span><span data-i="foot2">Personal reports · access by code only</span></footer>
<div id="tip" role="tooltip"></div>

<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/crypto.js"></script>
<script src="assets/report.js"></script>
<script>
(function () {
  const S = window.SITE, $ = id => document.getElementById(id), T = I18N.t;
  let current = null, lastMsg = null;
  $("first").textContent = S.coachFirst; $("last").textContent = S.coachLast;
  $("ad").href = S.recoveryLink;

  function contact() {
    const links = [];
    if (S.whatsapp) links.push(`<a class="wa" href="https://wa.me/${S.whatsapp.replace(/\D/g, "")}" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.6-.3Z"/></svg><span>${T("wa")}</span></a>`);
    if (S.instagram) links.push(`<a class="ig" href="https://www.instagram.com/${S.instagram.replace(/^@/, "")}/" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg><span dir="ltr">@${S.instagram.replace(/^@/, "")}</span></a>`);
    $("contact").innerHTML = links.join("");
  }

  function apply() {
    const l = I18N.lang, name = T("coach");
    document.documentElement.lang = l === "fil" ? "fil" : l;
    document.documentElement.dir = I18N.dir();
    document.querySelectorAll("[data-i]").forEach(n => n.textContent = T(n.dataset.i));
    $("legal").textContent = T("legal", { name });
    $("copy").textContent = T("foot", { year: new Date().getFullYear(), name });
    $("langname").textContent = I18N.langs[l]._name;
    $("langmenu").innerHTML = I18N.order.map(k => `<button type="button" role="menuitemradio" aria-checked="${k === l}" data-l="${k}" lang="${k}" dir="${I18N.langs[k]._dir}">${I18N.langs[k]._name}${k === l ? " ✓" : ""}</button>`).join("");
    contact();
    if (lastMsg) setMsg(...lastMsg);
    if (current) draw();
  }
  function setMsg(kind, key, vars) { lastMsg = [kind, key, vars]; $("msg").className = "msg" + (kind === "ok" ? " ok" : ""); $("msg").textContent = key ? T(key, vars) : ""; }

  /* language menu */
  const menu = $("langmenu"), globe = $("globe");
  const closeMenu = () => { menu.hidden = true; globe.setAttribute("aria-expanded", "false"); };
  globe.addEventListener("click", e => { e.stopPropagation(); const open = menu.hidden; menu.hidden = !open; globe.setAttribute("aria-expanded", String(open)); if (open) menu.querySelector("button")?.focus(); });
  menu.addEventListener("click", e => { const b = e.target.closest("button[data-l]"); if (!b) return; I18N.set(b.dataset.l); closeMenu(); apply(); globe.focus(); });
  document.addEventListener("click", e => { if (!e.target.closest(".langwrap")) closeMenu(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { closeMenu(); globe.focus(); } });

  /* protection */
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && ["s", "p", "c"].includes(e.key.toLowerCase()) && e.target.id !== "code") e.preventDefault(); });

  function draw() {
    Report.render($("report"), current, () => { current = null; $("report").hidden = true; $("report").innerHTML = ""; $("code").value = ""; setMsg("", ""); window.scrollTo({ top: 0, behavior: "smooth" }); });
    $("report").hidden = false;
  }
  async function open(code) {
    const btn = $("go"), c = Vault.normCode(code);
    if (c.length < 4) { setMsg("", "msgShort"); return; }
    btn.disabled = true; setMsg("ok", "msgChecking");
    try {
      const id = await Vault.reportId(c);
      const res = await fetch("reports/" + id + ".json", { cache: "no-store" });
      if (!res.ok) throw new Error("nf");
      current = await Vault.decryptReport(c, await res.json());
      setMsg("ok", "msgReady", { name: current.client });
      draw();
      $("report").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { setMsg("", "msgNotFound"); }
    finally { btn.disabled = false; }
  }
  $("finder").addEventListener("submit", e => { e.preventDefault(); open($("code").value); });
  apply();
})();
</script>
</body>
</html>
